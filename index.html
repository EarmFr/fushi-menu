<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement du menu...</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 100px; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Connexion et redirection vers le menu Zelty...</p>

    <script>
        // 1. Récupérer le numéro de table depuis l'URL (ex: ?table=5)
        const urlParams = new URLSearchParams(window.location.search);
        const numeroTable = urlParams.get('table_number') || 'Inconnue';

        // 2. Mettre l'URL de VOTRE page de commande Zelty
        const urlZelty = "https://fushitang.zelty-order.fr/restaurants/7684"
"; 

        // Ouvre l'application Zelty dans la même fenêtre
        const fenetreMenu = window.location.replace(urlZelty);

        // 3. Injecter les données anonymes dès que la page Zelty se charge
        window.addEventListener('DOMContentLoaded', () => {
            const injecterDonnees = () => {
                const prenom = document.querySelector('input[name="first_name"]');
                const nom = document.querySelector('input[name="last_name"]');
                const telephone = document.querySelector('input[name="phone"]');
                const email = document.querySelector('input[name="email"]');

                if (prenom && nom && telephone && email) {
                    prenom.value = "Anonyme";
                    nom.value = "Anonyme";
                    telephone.value = "0600000000";
                    email.value = "anonyme_t" + numeroTable + "@restaurant.fr";

                    // Événements obligatoires pour Next.js / React
                    const event = new Event('input', { bubbles: true });
                    prenom.dispatchEvent(event);
                    nom.dispatchEvent(event);
                    telephone.dispatchEvent(event);
                    email.dispatchEvent(event);
                    
                    clearInterval(verificationId);
                }
            };

            // Vérifie la présence du formulaire toutes les 200ms
            const verificationId = setInterval(injecterDonnees, 200);
        });
    </script>
</body>
</html>
